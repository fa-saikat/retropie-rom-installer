<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 256 256" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#171c2b"/>
      <stop offset="100%" stop-color="#0f1419"/>
    </linearGradient>
    <linearGradient id="pad" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#afa9ec"/>
      <stop offset="100%" stop-color="#7f77dd"/>
    </linearGradient>
  </defs>

  <!-- app tile background -->
  <rect x="0" y="0" width="256" height="256" rx="56" fill="url(#bg)"/>
  <rect x="1.5" y="1.5" width="253" height="253" rx="54.5" fill="none" stroke="#262c42" stroke-width="3"/>

  <!-- two stacked "file" cards behind the pad, hinting at grouped multi-file
       ROM entries collapsing into one library item -->
  <rect x="70" y="70" width="96" height="70" rx="12" fill="#26215c"/>
  <rect x="86" y="58" width="96" height="70" rx="12" fill="#1c2033"/>

  <!-- game controller silhouette -->
  <path d="
    M 82 158
    c 0 -22 16 -36 36 -36
    h 20
    c 20 0 36 14 36 36
    l 8 30
    c 3 12 -8 22 -19 17
    l -21 -10
    a 14 14 0 0 0 -12 0
    l -21 10
    c -11 5 -22 -5 -19 -17
    z
  " fill="url(#pad)"/>

  <!-- d-pad -->
  <rect x="98" y="148" width="9" height="27" rx="2.5" fill="#171c2b"/>
  <rect x="88" y="158" width="29" height="9" rx="2.5" fill="#171c2b"/>

  <!-- face buttons -->
  <circle cx="158" cy="152" r="6" fill="#171c2b"/>
  <circle cx="174" cy="162" r="6" fill="#171c2b"/>

  <!-- accent glow dot, echoes the sidebar selection accent -->
  <circle cx="128" cy="210" r="5" fill="#afa9ec"/>
</svg>
