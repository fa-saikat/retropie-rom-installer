name: Release

# Pull requests build both .debs as downloadable artifacts. Pushes to main
# also publish a release, but only when Cargo.toml carries a version that
# hasn't been tagged yet; any other merge to main is a no-op.
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  version:
    runs-on: ubuntu-22.04
    outputs:
      version: ${{ steps.version.outputs.version }}
      release: ${{ steps.version.outputs.release }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Read version
        id: version
        run: |
          version=$(sed -n 's/^version *= *"\(.*\)"/\1/p' Cargo.toml | head -n1)
          echo "version=$version" >> "$GITHUB_OUTPUT"
          if [ "${{ github.event_name }}" = "pull_request" ] || [ "${{ github.ref }}" != "refs/heads/main" ]; then
            echo "release=false" >> "$GITHUB_OUTPUT"
          elif git rev-parse -q --verify "refs/tags/v$version" >/dev/null; then
            echo "v$version is already released, nothing to do."
            echo "release=false" >> "$GITHUB_OUTPUT"
          else
            echo "release=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Check changelog matches
        if: steps.version.outputs.release == 'true'
        run: |
          top=$(sed -n '1s/^retropie-rom-manager (\(.*\)-[0-9]*).*/\1/p' packaging/changelog)
          if [ "$top" != "${{ steps.version.outputs.version }}" ]; then
            echo "::error::packaging/changelog starts at $top, but Cargo.toml says ${{ steps.version.outputs.version }}. Run ./scripts/generate-changelog.sh."
            exit 1
          fi

  build:
    needs: version
    # Pull requests and manual runs always build; pushes only when releasing.
    if: github.event_name != 'push' || needs.version.outputs.release == 'true'
    strategy:
      fail-fast: false
      matrix:
        include:
          # 22.04's older glibc keeps the .deb installable on Debian 12 and up.
          - arch: amd64
            runner: ubuntu-22.04
          - arch: arm64
            runner: ubuntu-22.04-arm
    runs-on: ${{ matrix.runner }}
    env:
      # rustc can overflow its stack compiling gpui-component.
      RUST_MIN_STACK: "16777216"
    steps:
      - uses: actions/checkout@v4

      - name: Install build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            libxkbcommon-dev libxkbcommon-x11-dev libwayland-dev \
            libx11-xcb-dev libxcb1-dev libfontconfig-dev libfreetype-dev \
            libvulkan-dev libzstd-dev

      - uses: dtolnay/rust-toolchain@stable

      - uses: Swatinem/rust-cache@v2

      - uses: taiki-e/install-action@v2
        with:
          tool: cargo-deb

      - name: Test
        run: cargo test --locked

      - name: Build .deb
        run: |
          chmod 755 packaging/DEBIAN/postinst packaging/DEBIAN/postrm
          cargo deb

      - uses: actions/upload-artifact@v4
        with:
          name: deb-${{ matrix.arch }}
          path: target/debian/*.deb
          if-no-files-found: error

  release:
    needs: [version, build]
    if: needs.version.outputs.release == 'true'
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4

      - uses: actions/download-artifact@v4
        with:
          pattern: deb-*
          path: dist
          merge-multiple: true

      - name: Write checksums and release notes
        run: |
          (cd dist && sha256sum *.deb > SHA256SUMS && cat SHA256SUMS)
          # The top changelog entry's bullets, as a Markdown list.
          awk 'NR > 1 && /^ -- / { exit } NR > 2' packaging/changelog \
            | sed -e 's/^  \* /- /' -e 's/^    /  /' > notes.md
          cat notes.md

      - name: Create tag and release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          version=${{ needs.version.outputs.version }}
          gh release create "v$version" dist/*.deb dist/SHA256SUMS \
            --target "$GITHUB_SHA" \
            --title "v$version" \
            --notes-file notes.md \
            --latest
