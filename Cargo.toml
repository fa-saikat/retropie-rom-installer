[package]
name = "retropie-rom-manager"
version = "2.0.0"
edition = "2021"
license = "MIT"
repository = "https://github.com/fa-saikat/retropie-rom-installer"
description = "A desktop ROM manager for RetroPie: install, scrape, play and remove ROMs for 37 systems"

[dependencies]
# Re-exports the exact GPUI snapshot it's built against, so bumping this
# one line moves both.
gpui-kit = "0.7.1"
# Native file picker (XDG portal on Wayland, GTK on X11).
rfd = "0.15"
zip = "2"
tempfile = "3"
dirs = "5"
anyhow = "1"
# Read-only parse of EmulationStation's gamelist.xml.
roxmltree = "0.20"
# GPUI logs its GPU adapter choice; RUST_LOG=info shows it.
env_logger = { version = "0.11", default-features = false, features = ["auto-color"] }
log = "0.4"

[patch.crates-io]
# gpui-pre-wgpu 0.3.8 with a fix for GL drivers without vertex storage
# buffers (blank window on Mali-G31). Drop once this is fixed upstream:
# https://github.com/zed-industries/zed/issues/65765
gpui-pre-wgpu = { path = "vendor/gpui-pre-wgpu" }

[package.metadata.deb]
maintainer = "Fahim A Saikat <fahimabrar.saikat@gmail.com>"
copyright = "2026, JaduPc <Fahim A Saikat>"
license-file = ["LICENSE", "4"]
extended-description = """\
A desktop RetroPie ROM manager for Linux. Install, browse, play and \
uninstall ROMs for any of 37 RetroPie systems, with ROMs identified by \
their contents so they land in the right system, and automatic grouping \
of multi-file games (multi-track .cue/.bin, .gdi + tracks) into a single \
library entry."""
section = "utils"
priority = "optional"
# dpkg-shlibdeps against the binary picks up GPUI's X11/Wayland/fontconfig deps.
depends = "$auto"
maintainer-scripts = "packaging/DEBIAN"
changelog = "packaging/changelog"
assets = [
    ["target/release/retropie-rom-manager", "usr/bin/", "755"],
    ["packaging/retropie-rom-manager.desktop", "usr/share/applications/", "644"],
    ["assets/retropie-rom-manager.svg", "usr/share/icons/hicolor/256x256/apps/retropie-rom-manager.svg", "644"],
    # assets.rs falls back to a generic gamepad when a system icon is missing.
    ["assets/icons/*", "usr/share/retropie-rom-manager/assets/icons/", "644"],
    # System photos for the "Add emulator" picker, with their credits.
    ["assets/systems/*", "usr/share/retropie-rom-manager/assets/systems/", "644"],
]
