[package]
name = "retropie-rom-manager"
version = "1.1.0"
edition = "2021"
description = "A GPUI desktop app for installing/uninstalling RetroPie ROMs"

[dependencies]
# GPUI Kit (https://gpui-kit.com): the styled component library plus the exact
# GPUI snapshot it's built against, re-exported as `gpui_kit::*`. It pins GPUI
# itself (`gpui-pre`, exact version), so bumping this one line moves both.
gpui-kit = "0.7.1"

# Native "Open file" dialog (GTK/Qt-free, works on X11/Wayland via a portal
# or GTK depending on what's installed). Runs the picker off the UI thread.
rfd = "0.15"

# Zip extraction, mirrors the Python prototype's stage-1 extractor.
zip = "2"

# Scratch directories for extraction, auto-cleaned on drop.
tempfile = "3"

# Home directory resolution ($HOME/RetroPie/roms).
dirs = "5"

# Ergonomic error handling across the install/uninstall pipeline.
anyhow = "1"

# Read-only parse of EmulationStation's gamelist.xml (scraped art + metadata).
roxmltree = "0.20"

# [[bin]]
# name = "retropie-rom-manager"
# path = "src/main.rs"

[package.metadata.deb]
maintainer = "Fahim A Saikat <fahimabrar.saikat@gmail.com>"
copyright = "2026, JaduPc <Fahim A Saikat>"
license-file = ["LICENSE", "4"]
extended-description = """\
A desktop RetroPie ROM manager for Linux. Install, browse, and uninstall \
ROMs across six emulators (Arcade/MAME, Dreamcast, Game Boy Advance, \
Sega Genesis/MD, PlayStation, Nintendo 64), with automatic grouping of \
multi-file games (multi-track .cue/.bin, .gdi + tracks) into a single \
library entry."""
section = "utils"
priority = "optional"
depends = "$auto"   # dpkg-shlibdeps against the binary — GPUI's GTK/X11/
                     # Wayland/fontconfig deps get picked up automatically,
                     # which is the main thing that keeps installs from
                     # breaking on a machine missing a shared library.
maintainer-scripts = "packaging/DEBIAN"
changelog = "packaging/changelog"
assets = [
    ["target/release/retropie-rom-manager", "usr/bin/", "755"],
    ["packaging/retropie-rom-manager.desktop", "usr/share/applications/", "644"],
    # Uncomment once a real app icon exists (see note below) —
    ["assets/retropie-rom-manager.svg", "usr/share/icons/hicolor/256x256/apps/retropie-rom-manager.svg", "644"],

    # Per-system icons. Optional: assets.rs falls back to a generic gamepad
    # icon when these aren't present.
    ["assets/icons/*", "usr/share/retropie-rom-manager/assets/icons/", "644"],
]
